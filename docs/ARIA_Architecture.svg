<svg width="900" height="1080" viewBox="0 0 900 1080" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">

  <!-- Background -->
  <rect width="900" height="1080" fill="#0f1117"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">ARIA — Autonomous Response Intelligence Assistant</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#888888">Emergency Incident Intelligence System | Amazon Bedrock</text>

  <!-- ── LAYER 1: INPUT ── -->
  <rect x="300" y="80" width="300" height="54" rx="10" fill="#1e2230" stroke="#444" stroke-width="1"/>
  <text x="450" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Layer 1 — 911 Call Received</text>
  <text x="450" y="120" text-anchor="middle" font-size="11" fill="#aaaaaa">Voice · Text · Video</text>

  <!-- Arrow -->
  <line x1="450" y1="134" x2="450" y2="158" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── LAYER 2: TRANSCRIBE ── -->
  <rect x="270" y="158" width="360" height="54" rx="10" fill="#1a2a3a" stroke="#2d6fa8" stroke-width="1.5"/>
  <text x="450" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#60aaee">Layer 2 — Amazon Transcribe</text>
  <text x="450" y="198" text-anchor="middle" font-size="11" fill="#7ab8e8">Real-time speech to text · 185+ languages</text>

  <!-- Arrow -->
  <line x1="450" y1="212" x2="450" y2="236" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── LAYER 3: DISPATCHER AGENT ── -->
  <rect x="240" y="236" width="420" height="60" rx="10" fill="#1e1a35" stroke="#6c5ce7" stroke-width="1.5"/>
  <text x="450" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#a89df0">Layer 3 — Stream Processor + Domain Watchers</text>
  <text x="450" y="275" text-anchor="middle" font-size="11" fill="#8878d0">Per-word pipeline · Pattern watchers · Async agent triggers · Live WebSocket feed</text>
  <text x="450" y="290" text-anchor="middle" font-size="10" fill="#6655bb">aria-stream-processor Lambda · Provisioned Concurrency: 10 · Never batches</text>

  <!-- Arrow -->
  <line x1="450" y1="296" x2="450" y2="320" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── LAYER 4: COORDINATOR AGENT ── -->
  <rect x="200" y="320" width="500" height="64" rx="10" fill="#1e1a35" stroke="#9b59b6" stroke-width="2"/>
  <text x="450" y="343" text-anchor="middle" font-size="14" font-weight="700" fill="#cc99ff">Layer 4 — Coordinator Agent (Synthesizer)</text>
  <text x="450" y="360" text-anchor="middle" font-size="11" fill="#aa88dd">Awaits agent results · Resolves conflicts · Streams progressive card updates</text>
  <text x="450" y="376" text-anchor="middle" font-size="10" fill="#8866bb">Bedrock Claude Sonnet · Haiku verifier enriches context in parallel</text>

  <!-- Fan-out lines to 4 agents -->
  <path d="M310 384 L310 440 L120 440 L120 460" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M370 384 L370 440 L300 440 L300 460" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M530 384 L530 440 L600 440 L600 460" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M590 384 L590 440 L780 440 L780 460" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ── LAYER 5: FOUR SPECIALIST AGENTS ── -->
  <!-- Navigation -->
  <rect x="40" y="460" width="160" height="80" rx="10" fill="#0d2b2b" stroke="#1abc9c" stroke-width="1.5"/>
  <text x="120" y="484" text-anchor="middle" font-size="12" font-weight="700" fill="#1abc9c">Navigation</text>
  <text x="120" y="500" text-anchor="middle" font-size="12" font-weight="700" fill="#1abc9c">Agent</text>
  <text x="120" y="518" text-anchor="middle" font-size="10" fill="#7ecec4">Routes · ETAs</text>
  <text x="120" y="532" text-anchor="middle" font-size="10" fill="#7ecec4">Lambda · DynamoDB</text>

  <!-- Medical -->
  <rect x="220" y="460" width="160" height="80" rx="10" fill="#0d2b2b" stroke="#1abc9c" stroke-width="1.5"/>
  <text x="300" y="484" text-anchor="middle" font-size="12" font-weight="700" fill="#1abc9c">Medical</text>
  <text x="300" y="500" text-anchor="middle" font-size="12" font-weight="700" fill="#1abc9c">Agent</text>
  <text x="300" y="518" text-anchor="middle" font-size="10" fill="#7ecec4">Hospital · Triage</text>
  <text x="300" y="532" text-anchor="middle" font-size="10" fill="#7ecec4">Knowledge Base · Lambda</text>

  <!-- Fire / Hazmat -->
  <rect x="520" y="460" width="160" height="80" rx="10" fill="#2b1a0d" stroke="#e67e22" stroke-width="1.5"/>
  <text x="600" y="484" text-anchor="middle" font-size="12" font-weight="700" fill="#e67e22">Fire / Hazmat</text>
  <text x="600" y="500" text-anchor="middle" font-size="12" font-weight="700" fill="#e67e22">Agent</text>
  <text x="600" y="518" text-anchor="middle" font-size="10" fill="#c49a6c">Hazards · Evac radius</text>
  <text x="600" y="532" text-anchor="middle" font-size="10" fill="#c49a6c">FEMA KB · Lambda</text>

  <!-- Report -->
  <rect x="700" y="460" width="160" height="80" rx="10" fill="#1e1e1e" stroke="#888888" stroke-width="1.5"/>
  <text x="780" y="484" text-anchor="middle" font-size="12" font-weight="700" fill="#cccccc">Report</text>
  <text x="780" y="500" text-anchor="middle" font-size="12" font-weight="700" fill="#cccccc">Agent</text>
  <text x="780" y="518" text-anchor="middle" font-size="10" fill="#999999">Live logging</text>
  <text x="780" y="532" text-anchor="middle" font-size="10" fill="#999999">DynamoDB · S3</text>

  <!-- Arrows from Nav + Medical to KB -->
  <path d="M120 540 L120 590 L340 590" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M300 540 L300 590 L340 590" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M600 540 L600 590 L560 590" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ── LAYER 6: KNOWLEDGE BASE ── -->
  <rect x="200" y="576" width="500" height="68" rx="10" fill="#0f1e35" stroke="#2980b9" stroke-width="1.5"/>
  <text x="450" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="#5dade2">Layer 6 — Bedrock Knowledge Base</text>
  <text x="450" y="618" text-anchor="middle" font-size="11" fill="#7fb3d3">Medical protocols · FEMA hazmat · Hospital data · SOPs</text>
  <text x="450" y="635" text-anchor="middle" font-size="10" fill="#5a8fa8">S3 + Titan Embeddings v2 · RAG retrieval · OpenSearch Serverless</text>

  <!-- RAG return arrow (dashed) back to coordinator -->
  <path d="M198 610 L160 610 L160 352 L198 352" fill="none" stroke="#444" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="80" y="490" text-anchor="middle" font-size="10" fill="#666666" transform="rotate(-90 80 490)">RAG results</text>

  <!-- Arrow to guardrails -->
  <line x1="450" y1="644" x2="450" y2="674" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── LAYER 7: GUARDRAILS ── -->
  <rect x="210" y="674" width="480" height="64" rx="10" fill="#2b2200" stroke="#f39c12" stroke-width="1.5"/>
  <text x="450" y="697" text-anchor="middle" font-size="13" font-weight="700" fill="#f1c40f">Layer 7 — Bedrock Guardrails</text>
  <text x="450" y="714" text-anchor="middle" font-size="11" fill="#d4ac0d">No auto-execution · Human always approves · PII blocked</text>
  <text x="450" y="730" text-anchor="middle" font-size="10" fill="#b7950b">Hallucination filter · Override logging · Safety enforcement</text>

  <!-- Arrow to dashboard -->
  <line x1="450" y1="738" x2="450" y2="768" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── LAYER 8: DASHBOARD ── -->
  <rect x="200" y="768" width="500" height="64" rx="10" fill="#0d2b0d" stroke="#27ae60" stroke-width="1.5"/>
  <text x="450" y="791" text-anchor="middle" font-size="13" font-weight="700" fill="#2ecc71">Layer 8 — Dispatcher Dashboard</text>
  <text x="450" y="808" text-anchor="middle" font-size="11" fill="#58d68d">Single recommendation card · One-click approve / override</text>
  <text x="450" y="824" text-anchor="middle" font-size="10" fill="#45b39d">React · API Gateway WebSocket · Vercel · Progressive field-by-field rendering</text>

  <!-- Arrow to outputs -->
  <line x1="450" y1="832" x2="450" y2="862" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Fan out to 3 outputs -->
  <path d="M450 862 L175 862" fill="none" stroke="#555" stroke-width="1.2"/>
  <path d="M450 862 L725 862" fill="none" stroke="#555" stroke-width="1.2"/>
  <line x1="175" y1="862" x2="175" y2="882" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="450" y1="862" x2="450" y2="882" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="725" y1="862" x2="725" y2="882" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ── LAYER 9: THREE OUTPUTS ── -->
  <!-- Responder Push -->
  <rect x="60" y="882" width="230" height="68" rx="10" fill="#0d2b2b" stroke="#1abc9c" stroke-width="1.5"/>
  <text x="175" y="906" text-anchor="middle" font-size="12" font-weight="700" fill="#1abc9c">Responder Push</text>
  <text x="175" y="922" text-anchor="middle" font-size="10" fill="#7ecec4">Route logged (no device push)</text>
  <text x="175" y="938" text-anchor="middle" font-size="10" fill="#7ecec4">Google Maps API + DynamoDB</text>

  <!-- Hospital Pre-Alert -->
  <rect x="335" y="882" width="230" height="68" rx="10" fill="#0d2b2b" stroke="#1abc9c" stroke-width="1.5"/>
  <text x="450" y="906" text-anchor="middle" font-size="12" font-weight="700" fill="#1abc9c">Hospital Pre-Alert</text>
  <text x="450" y="922" text-anchor="middle" font-size="10" fill="#7ecec4">ER readiness before arrival</text>
  <text x="450" y="938" text-anchor="middle" font-size="10" fill="#7ecec4">Mock Hospital API</text>

  <!-- Incident Log -->
  <rect x="610" y="882" width="230" height="68" rx="10" fill="#1e1e1e" stroke="#888888" stroke-width="1.5"/>
  <text x="725" y="906" text-anchor="middle" font-size="12" font-weight="700" fill="#cccccc">Incident Log</text>
  <text x="725" y="922" text-anchor="middle" font-size="10" fill="#999999">After-action report auto-generated</text>
  <text x="725" y="938" text-anchor="middle" font-size="10" fill="#999999">DynamoDB + S3</text>

  <!-- Footer -->
  <text x="450" y="1010" text-anchor="middle" font-size="11" fill="#555555">ARIA — AWSHacks 2026 · Bedrock Track · Build with Gratitude</text>
  <text x="450" y="1028" text-anchor="middle" font-size="10" fill="#444444">All agent actions require human dispatcher approval · No auto-execution · Bedrock Guardrails enforced at every step</text>
  <text x="450" y="1050" text-anchor="middle" font-size="10" fill="#444444">Stream Processor + Domain Watchers → Agents (async) → Haiku Verifier → Sonnet Synthesizer → RAG · Guardrails → Human decision</text>

  <!-- ── CLAUDE HAIKU VERIFIER (parallel, never gating) ── -->
  <rect x="8" y="294" width="144" height="66" rx="8" fill="#1e1a35" stroke="#6c5ce7" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="80" y="314" text-anchor="middle" font-size="10" font-weight="700" fill="#a89df0">Claude Haiku 3.5</text>
  <text x="80" y="328" text-anchor="middle" font-size="9" fill="#8878d0">Verifier — parallel, not gating</text>
  <text x="80" y="342" text-anchor="middle" font-size="9" fill="#8878d0">Resolves ambiguities</text>
  <text x="80" y="356" text-anchor="middle" font-size="9" fill="#6655bb">enriches agent context mid-run</text>
  <line x1="152" y1="348" x2="200" y2="356" stroke="#6c5ce7" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- ── WEBSOCKET SPINE (right side — every word + every agent result) ── -->
  <line x1="876" y1="248" x2="876" y2="800" stroke="#2ecc71" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="876" y="524" text-anchor="middle" font-size="9" fill="#2ecc71" transform="rotate(-90 876 524)">WebSocket — live words + agent results → dashboard</text>
  <!-- Stream Processor → WebSocket spine -->
  <line x1="660" y1="266" x2="870" y2="266" stroke="#2ecc71" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <!-- WebSocket spine → Layer 8 Dashboard -->
  <line x1="870" y1="800" x2="700" y2="800" stroke="#2ecc71" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- Domain watcher trigger annotation -->
  <text x="450" y="453" text-anchor="middle" font-size="9" fill="#777777">async domain watcher triggers</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

</svg>
